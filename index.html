<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Job Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23ffecce'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='700' font-size='34' text-anchor='middle' fill='%23111'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f3f1; --surface:#ffffff; --surface-2:#f8f7f5; --text:#16181d; --muted:#5d6370; --line:#e3e1dc;
  --navy:#1d2340; --accent:#ff6a3d; --teal:#2bb3a3; --cream:#ffecce;
  --applied:#3d63dd; --screen:#b7791f; --interview:#2b8a3e; --offer:#0e8a7a; --rejected:#9aa0a6;
  --series-1:#2a78d6; --radius:30px; --shadow:0 1px 2px rgba(20,22,30,.06),0 8px 24px rgba(20,22,30,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101217; --surface:#191c23; --surface-2:#20242c; --text:#eceef2; --muted:#9aa1ad; --line:#2a2f39;
    --navy:#e8ebf5; --series-1:#3987e5; --accent:#ff7a4d; --applied:#7d9bff; --screen:#e6b25a; --interview:#5fcf7a; --offer:#4fd1c0; --rejected:#7d838c;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#101217; --surface:#191c23; --surface-2:#20242c; --text:#eceef2; --muted:#9aa1ad; --line:#2a2f39;
  --navy:#e8ebf5; --series-1:#3987e5; --accent:#ff7a4d; --applied:#7d9bff; --screen:#e6b25a; --interview:#5fcf7a; --offer:#4fd1c0; --rejected:#7d838c;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 "Sofia Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}

/* hero */
.hero{position:relative;overflow:hidden;color:#fff;padding:28px 0 40px;
  background:linear-gradient(120deg,#ff7a59,#ff9f6b 30%,#5cc8b8 70%,#2b8fb3);background-size:200% 200%;animation:drift 18s ease-in-out infinite}
@keyframes drift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@media (prefers-reduced-motion:reduce){.hero{animation:none}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px}
.mark i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--cream);color:#111;font-style:normal;font-weight:700}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:rgba(255,255,255,.22);color:#fff;transition:background .2s}
.iconbtn:hover{background:rgba(255,255,255,.34)}
.iconbtn svg{width:20px;height:20px}
h1{font-weight:300;font-size:clamp(34px,6vw,56px);line-height:1.05;margin:8px 0 6px;letter-spacing:-.5px}
h1 b{font-weight:700}
.sub{opacity:.92;margin:0}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:-52px;position:relative}
.stat{background:var(--surface);border-radius:24px;padding:18px 20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.stat .n{font-size:36px;font-weight:700;line-height:1;color:var(--navy)}
.stat .l{color:var(--muted);font-size:14px;margin-top:6px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}

/* dashboard */
.dash{margin:28px 0 0}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px 20px;box-shadow:var(--shadow)}
.metric .v{font-size:32px;font-weight:700;line-height:1.1;color:var(--text);font-variant-numeric:tabular-nums}
.metric .l{color:var(--muted);font-size:14px;margin-top:4px}
.metric .d{color:var(--muted);font-size:13px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.panel{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px 20px 12px;box-shadow:var(--shadow);min-width:0}
.panel figcaption{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.panel figcaption b{font-weight:600;font-size:16px}
.panel figcaption span{color:var(--muted);font-size:13px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:inherit;fill:var(--muted);font-size:11px}
.chart .lbl{fill:var(--text);font-size:12px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar,.chart .whisk,.chart .cap,.chart .mid{pointer-events:none}
.chart .bar{fill:var(--series-1)}
.chart .hit{fill:transparent;cursor:default}
.chart g.on .bar{opacity:.75}
.chart .whisk{stroke:var(--series-1);stroke-width:2;stroke-linecap:round}
.chart .cap{stroke:var(--series-1);stroke-width:2;stroke-linecap:round}
.chart .mid{fill:var(--series-1);stroke:var(--surface);stroke-width:2}
.chart .empty{fill:var(--muted);font-size:13px}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--navy);color:var(--bg);border-radius:10px;padding:7px 10px;font-size:13px;line-height:1.35;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:240px}
.tip strong{display:block;font-size:14px}
@media (max-width:760px){.charts{grid-template-columns:1fr}}
@media (max-width:640px){.metrics{grid-template-columns:repeat(2,1fr)}.metric .v{font-size:28px}}

/* status tabs */
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  margin:12px -16px 0;padding:12px 16px;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:8px 13px;cursor:pointer;font-size:14px;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.tab:hover{border-color:var(--muted)}
.tab .ct{font-size:12px;font-weight:700;min-width:22px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);text-align:center}
.tab[aria-selected="true"]{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.tab[aria-selected="true"] .ct{background:rgba(255,255,255,.18);color:inherit}
.tab .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.tab[aria-selected="true"] .dot{background:var(--bg)}
section[hidden]{display:none}

/* sections */
section{margin:40px 0}
h2{font-size:24px;font-weight:600;margin:0 0 14px;display:flex;align-items:baseline;gap:10px}
h2 small{color:var(--muted);font-size:15px;font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;outline:none}
.search:focus{border-color:var(--accent)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--bg);border-color:var(--navy)}

/* list rows */
.row{display:grid;grid-template-columns:76px 40px 1fr auto;gap:14px;align-items:center;padding:16px 22px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.date{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.co{font-weight:700;font-size:17px}
.role{color:var(--text)}
.meta{color:var(--muted);font-size:14px}
.note{color:var(--accent);font-size:14px;margin-top:2px}
.status{font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.s-Applied{color:var(--applied)} .s-Screening{color:var(--screen)} .s-Interviewing{color:var(--interview)} .s-Offer{color:var(--offer)} .s-Rejected{color:var(--rejected)}
.empty{padding:28px 22px;color:var(--muted)}
@media (max-width:640px){
  .row{grid-template-columns:40px 1fr auto;padding:14px 18px}
  .row .date{grid-column:1/-1;order:-1}
}

/* logos */
.logo{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;
  background:#fff;border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--navy)}
.logo{position:relative}
.logo img{position:absolute;inset:0;margin:auto;width:24px;height:24px;object-fit:contain;display:block;opacity:0;transition:opacity .2s}
.logo.has img.ok{opacity:1}
.logo.has.loaded{background:#fff;color:transparent}
.logo.ini{background:var(--surface-2)}
.tile .head{display:flex;gap:12px;align-items:flex-start}

/* tiles */
#recruiters{grid-template-columns:1fr}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.tile .co{margin-bottom:2px}
.tile dl{margin:14px 0 0;display:grid;gap:8px}
.tile dt{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.tile dd{margin:0}
.tile .next{background:var(--surface-2);border-radius:14px;padding:10px 12px}

/* lock */
.lock{min-height:100vh;display:grid;place-items:center;padding:16px;
  background:linear-gradient(120deg,#ff7a59,#ff9f6b 30%,#5cc8b8 70%,#2b8fb3)}
.lockcard{width:100%;max-width:380px;background:var(--surface);border-radius:var(--radius);padding:32px 28px;box-shadow:0 20px 60px rgba(0,0,0,.18);text-align:center}
.lockcard .mark{justify-content:center;margin-bottom:18px}
.lockcard h2{justify-content:center;font-weight:300;font-size:30px;margin-bottom:6px}
.lockcard p{color:var(--muted);margin:0 0 20px}
.lockcard input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:13px 18px;text-align:center;outline:none;letter-spacing:1px}
.lockcard input:focus{border-color:var(--accent)}
.lockcard button{margin-top:12px;width:100%;border:0;border-radius:999px;padding:13px;background:var(--navy);color:var(--bg);font-weight:600;cursor:pointer}
.remember{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;color:var(--muted);font-size:14px;cursor:pointer}
.lockcard .remember input{width:auto;padding:0;margin:0;accent-color:var(--accent)}
.err{color:#d93025;font-size:14px;min-height:20px;margin-top:10px}
footer{color:var(--muted);font-size:14px;padding:24px 0 48px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="lock" id="lock">
  <form class="lockcard" id="lockform" autocomplete="off">
    <div class="mark"><i>R</i></div>
    <h2>Job Tracker</h2>
    <p>Enter your passcode to view.</p>
    <input id="pass" type="password" placeholder="Passcode" aria-label="Passcode" autofocus>
    <label class="remember"><input type="checkbox" id="remember" checked> Remember this device</label>
    <button type="submit">Unlock</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
  <header class="hero">
    <div class="wrap">
      <div class="top">
        <span></span>
        <div style="display:flex;gap:8px">
          <button class="iconbtn" id="theme" aria-label="Switch to dark mode"></button>
        </div>
      </div>
      <h1>Job <b>Tracker</b></h1>
      <p class="sub" id="updated"></p>
    </div>
  </header>

  <main class="wrap">
    <section class="dash" aria-label="Dashboard">
      <div class="metrics" id="metrics"></div>
      <div class="charts">
        <figure class="panel">
          <figcaption><b>Application activity</b><span id="act-sub"></span></figcaption>
          <div class="chart" id="activity"></div>
        </figure>
        <figure class="panel">
          <figcaption><b>Salary ranges</b><span>Posted base pay, where listed</span></figcaption>
          <div class="chart" id="salary"></div>
        </figure>
      </div>
    </section>
    <div class="tip" id="tip" role="status" hidden></div>

    <nav class="tabs" id="tabs" role="tablist" aria-label="Status"></nav>

    <section id="sec-sub">
      <h2>Submitted <small id="subcount"></small></h2>
      <div class="bar">
        <input class="search" id="q" type="search" placeholder="Search company or role" aria-label="Search">
      </div>
      <div class="card" id="list"></div>
    </section>

    <section id="sec-progress">
      <h2>In progress <small>needs one action from you</small></h2>
      <div class="tiles" id="progress"></div>
    </section>

    <section id="sec-rec">
      <h2>Recruiters &amp; contracts</h2>
      <div class="tiles" id="recruiters"></div>
    </section>

    <section id="sec-targets">
      <h2>Not yet applied</h2>
      <div class="tiles" id="targets"></div>
    </section>

    <footer><span>Private · encrypted on this page</span><span id="foot"></span></footer>
  </main>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const STATUSES = ["Applied","Screening","Interviewing","Offer","Rejected"];

  /* theme: icon-only sun/moon */
  const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  const store = { get(k){ try { return localStorage.getItem(k) } catch { return null } }, set(k,v){ try { localStorage.setItem(k,v) } catch {} } };
  const isDark = () => (document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
  const paintTheme = () => { const d = isDark(); $("theme").innerHTML = d ? SUN : MOON; $("theme").setAttribute("aria-label", d ? "Switch to light mode" : "Switch to dark mode"); };
  const saved = store.get("jt-theme"); if (saved) document.documentElement.dataset.theme = saved;
  $("theme").onclick = () => { const t = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = t; store.set("jt-theme", t); paintTheme(); };
  paintTheme();

  /* key storage: a non-extractable CryptoKey in IndexedDB (the passcode itself is never stored) */
  const idb = mode => new Promise((res, rej) => {
    const o = indexedDB.open("job-tracker", 1);
    o.onupgradeneeded = () => o.result.createObjectStore("k");
    o.onsuccess = () => res(o.result.transaction("k", mode).objectStore("k"));
    o.onerror = () => rej(o.error);
  });
  const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const saveKey = async k => { try { await req((await idb("readwrite")).put(k, "key")); } catch {} };
  const loadKey = async () => { try { return await req((await idb("readonly")).get("key")); } catch { return null; } };
  const forgetKey = async () => { try { await req((await idb("readwrite")).delete("key")); } catch {} };

  /* decrypt: PBKDF2-SHA256 -> AES-GCM-256 */
  let env;
  const getEnv = async () => env || (env = await fetch("data.enc.json", { cache: "no-store" }).then(r => r.json()));
  async function deriveKey(pass) {
    const e = await getEnv();
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(e.salt), iterations: e.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  }
  async function decryptWith(key) {
    const e = await getEnv();
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(e.iv) }, key, b64(e.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  const show = data => { $("lock").hidden = true; $("app").hidden = false; render(data); };

  /* auto-unlock on a device that remembers */
  (async () => {
    const k = await loadKey();
    if (!k) return;
    try { show(await decryptWith(k)); } catch { forgetKey(); }
  })();

  $("lockform").onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector("button");
    $("err").textContent = ""; btn.textContent = "Unlocking…"; btn.disabled = true;
    try {
      const key = await deriveKey($("pass").value);
      const data = await decryptWith(key);
      $("pass").value = "";
      if ($("remember").checked) await saveKey(key); else await forgetKey();
      show(data);
    }
    catch { $("err").textContent = "That passcode didn't work."; }
    finally { btn.textContent = "Unlock"; btn.disabled = false; }
  };

  const initials = n => String(n || "?").replace(/\(.*?\)/g, "").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
  const logo = (name, domain) => domain
    ? `<span class="logo ini has">${esc(initials(name))}<img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64" alt="" referrerpolicy="no-referrer" onload="if(this.naturalWidth>16){this.classList.add('ok');this.parentNode.classList.add('loaded')}" onerror="this.remove()"></span>`
    : `<span class="logo ini" aria-hidden="true">${esc(initials(name))}</span>`;

  const fmt = d => new Date(d + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });


  /* ---------- dashboard ---------- */
  const SVGNS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs = {}, parent) => { const n = document.createElementNS(SVGNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
  const tip = $("tip");
  const showTip = (e, title, line) => {
    tip.replaceChildren(); const t = document.createElement("strong"); t.textContent = title; tip.append(t, document.createTextNode(line));
    tip.hidden = false;
    const r = e.target.getBoundingClientRect ? e.target.getBoundingClientRect() : { left: e.clientX, top: e.clientY, width: 0 };
    const x = Math.min(window.innerWidth - tip.offsetWidth - 8, Math.max(8, r.left + r.width / 2 - tip.offsetWidth / 2));
    tip.style.left = x + "px"; tip.style.top = Math.max(8, r.top - tip.offsetHeight - 8) + "px";
  };
  const hideTip = () => { tip.hidden = true; };
  const k = n => "$" + (Math.round(n / 500) / 2).toString().replace(/\.0$/, "") + "K";
  const dayKey = d => d.toISOString().slice(0, 10);

  function renderDash(data) {
    const subs = data.submitted;
    const responses = subs.filter(s => s.status !== "Applied" || s.viewed).length;
    const interviews = subs.filter(s => ["Screening","Interviewing","Offer"].includes(s.status)).length;
    const today = new Date(data.updated + "T12:00:00");
    const weekAgo = new Date(today); weekAgo.setDate(weekAgo.getDate() - 6);
    const thisWeek = subs.filter(s => new Date(s.date + "T12:00:00") >= weekAgo).length;
    const rate = subs.length ? Math.round(responses / subs.length * 100) : 0;
    const tiles = [
      [subs.length, "Applications sent", thisWeek + " in the last 7 days"],
      [rate + "%", "Response rate", responses + " of " + subs.length + " heard back"],
      [interviews, "Interviews", interviews ? "screens and interviews" : "none yet"],
      [data.inProgress.length, "In progress", "need one action"]
    ];
    $("metrics").replaceChildren(...tiles.map(([v, l, d]) => {
      const m = document.createElement("div"); m.className = "metric";
      m.innerHTML = `<div class="v"></div><div class="l"></div><div class="d"></div>`;
      m.children[0].textContent = v; m.children[1].textContent = l; m.children[2].textContent = d; return m;
    }));

    /* activity: applications per day, first application -> updated date */
    const dated = subs;
    const first = new Date(dated.map(s => s.date).sort()[0] + "T12:00:00");
    const days = []; for (const d = new Date(first); d <= today; d.setDate(d.getDate() + 1)) days.push(dayKey(d));
    const counts = days.map(d => dated.filter(s => s.date === d));
    const W = Math.max(280, $("activity").clientWidth || 480), H = 200, padL = 26, padB = 26, padT = 10, plotW = W - padL, plotH = H - padB - padT;
    const max = Math.max(4, ...counts.map(c => c.length)); const step = max > 10 ? 5 : 2; const top = Math.ceil(max / step) * step;
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `Applications per day: ${days.map((d, i) => fmt(d) + " " + counts[i].length).join(", ")}` });
    for (let v = 0; v <= top; v += step) {
      const y = padT + plotH - v / top * plotH;
      el("line", { class: "grid", x1: padL, x2: W, y1: y, y2: y }, svg);
      el("text", { x: padL - 6, y: y + 4, "text-anchor": "end" }, svg).textContent = v;
    }
    const bw = plotW / days.length, barW = Math.max(4, Math.min(28, bw - 6));
    const labelEvery = Math.ceil(days.length / 6);
    days.forEach((d, i) => {
      const n = counts[i].length, x = padL + i * bw + (bw - barW) / 2, h = n / top * plotH, y = padT + plotH - h;
      const g = el("g", {}, svg);
      if (n) {
        const r = Math.min(4, barW / 2, h);
        el("path", { class: "bar", d: `M${x},${y + h} V${y + r} Q${x},${y} ${x + r},${y} H${x + barW - r} Q${x + barW},${y} ${x + barW},${y + r} V${y + h} Z` }, g);
      }
      const hit = el("rect", { class: "hit", x: padL + i * bw, y: padT, width: bw, height: plotH + 4, tabindex: 0 }, g);
      const names = counts[i].map(s => s.company);
      const line = n ? `${n} application${n > 1 ? "s" : ""}${names.length <= 4 ? ": " + names.join(", ") : ""}` : "No applications";
      const on = e => { g.classList.add("on"); showTip(e, fmt(d), line); }; const off = () => { g.classList.remove("on"); hideTip(); };
      hit.addEventListener("pointerenter", on); hit.addEventListener("pointerleave", off); hit.addEventListener("focus", on); hit.addEventListener("blur", off);
      if (i % labelEvery === 0 || i === days.length - 1) el("text", { x: padL + i * bw + bw / 2, y: H - 6, "text-anchor": "middle" }, svg).textContent = fmt(d);
    });
    $("activity").replaceChildren(svg);
    $("act-sub").textContent = `Applications sent per day, ${fmt(days[0])} – ${fmt(days[days.length - 1])}`;

    /* salary: low-high whisker per job, dot at midpoint */
    const jobs = [...subs, ...data.inProgress].filter(s => Array.isArray(s.salary)).sort((a, b) => (b.salary[0] + b.salary[1]) - (a.salary[0] + a.salary[1]));
    const sw = Math.max(280, $("salary").clientWidth || 480), rowH = 34, labW = sw < 380 ? 110 : 128, sPadT = 6, axisH = 22, sh = sPadT + jobs.length * rowH + axisH;
    const s2 = el("svg", { viewBox: `0 0 ${sw} ${Math.max(sh, 80)}`, role: "img", "aria-label": "Salary ranges: " + jobs.map(j => `${j.company} ${k(j.salary[0])} to ${k(j.salary[1])}`).join(", ") });
    if (!jobs.length) { el("text", { class: "empty", x: 0, y: 30 }, s2).textContent = "No salary ranges recorded yet."; $("salary").replaceChildren(s2); return; }
    const lo = Math.floor(Math.min(...jobs.map(j => j.salary[0])) / 25000) * 25000, hi = Math.ceil(Math.max(...jobs.map(j => j.salary[1])) / 25000) * 25000;
    const sx = v => labW + (v - lo) / (hi - lo) * (sw - labW - 18);
    for (let v = lo; v <= hi; v += 25000) {
      el("line", { class: "grid", x1: sx(v), x2: sx(v), y1: sPadT, y2: sPadT + jobs.length * rowH }, s2);
      el("text", { x: sx(v), y: sh - 6, "text-anchor": "middle" }, s2).textContent = k(v);
    }
    jobs.forEach((j, i) => {
      const cy = sPadT + i * rowH + rowH / 2, [a, b] = j.salary, g = el("g", {}, s2);
      el("text", { class: "lbl", x: 0, y: cy + 4 }, g).textContent = j.company.length > 18 ? j.company.slice(0, 17) + "…" : j.company;
      el("line", { class: "whisk", x1: sx(a), x2: sx(b), y1: cy, y2: cy }, g);
      el("line", { class: "cap", x1: sx(a), x2: sx(a), y1: cy - 6, y2: cy + 6 }, g);
      el("line", { class: "cap", x1: sx(b), x2: sx(b), y1: cy - 6, y2: cy + 6 }, g);
      el("circle", { class: "mid", cx: sx((a + b) / 2), cy, r: 5 }, g);
      const hit = el("rect", { class: "hit", x: 0, y: cy - rowH / 2, width: sw, height: rowH, tabindex: 0 }, g);
      const on = e => showTip(e, j.company, `${k(a)} – ${k(b)} · midpoint ${k((a + b) / 2)}`);
      hit.addEventListener("pointerenter", on); hit.addEventListener("pointerleave", hideTip); hit.addEventListener("focus", on); hit.addEventListener("blur", hideTip);
    });
    $("salary").replaceChildren(s2);
  }

  let lastData, rz;
  window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => lastData && renderDash(lastData), 150); });
  function render(data) {
    lastData = data;
    renderDash(data);
    const subs = data.submitted.slice().sort((a,b) => b.date.localeCompare(a.date));
    $("updated").textContent = "Updated " + new Date(data.updated + "T12:00:00").toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
    $("foot").textContent = subs.length + " applications since " + fmt(subs[subs.length-1].date);

    let tab = "Applied", q = "";
    const isInterview = st => ["Screening","Interviewing"].includes(st);
    const groups = [
      { id: "Applied",   label: "Applied",      n: subs.filter(x => x.status === "Applied").length, dot: "s-Applied" },
      { id: "progress",  label: "In progress",  n: data.inProgress.length },
      { id: "Interview", label: "Interviewing", n: subs.filter(x => isInterview(x.status)).length, dot: "s-Interviewing" },
      { id: "Offer",     label: "Offer",        n: subs.filter(x => x.status === "Offer").length, dot: "s-Offer", hideEmpty: true },
      { id: "Rejected",  label: "Rejected",     n: subs.filter(x => x.status === "Rejected").length, dot: "s-Rejected" },
      { id: "rec",       label: "Recruiters",   n: data.recruiters.length },
      { id: "targets",   label: "Targets", n: data.targets.length }
    ].filter(g => !(g.hideEmpty && !g.n));
    const saved = store.get("jt-tab"); if (groups.some(g => g.id === saved)) tab = saved;
    const paintTabs = () => {
      $("tabs").innerHTML = groups.map(g => `<button class="tab" role="tab" data-t="${g.id}" aria-selected="${g.id === tab}">${g.dot ? `<span class="dot ${g.dot}"></span>` : ""}${g.label}<span class="ct">${g.n}</span></button>`).join("");
      const subTab = !["progress","rec","targets"].includes(tab);
      $("sec-sub").hidden = !subTab;
      $("sec-progress").hidden = !(tab === "all" || tab === "progress");
      $("sec-rec").hidden = !(tab === "all" || tab === "rec");
      $("sec-targets").hidden = !(tab === "all" || tab === "targets");
    };
    $("tabs").onclick = e => { const b = e.target.closest(".tab"); if (!b) return; tab = b.dataset.t; store.set("jt-tab", tab); paintTabs(); draw(); b.scrollIntoView({ inline: "nearest", block: "nearest" }); };
    $("q").oninput = e => { q = e.target.value.toLowerCase(); draw(); };
    const inTab = st => tab === "all" || (tab === "Interview" ? isInterview(st) : st === tab);
    paintTabs();

    function draw() {
      const rows = subs.filter(s => inTab(s.status) && (!q || (s.company + " " + s.role).toLowerCase().includes(q)));
      $("subcount").textContent = rows.length === subs.length ? subs.length + " total" : rows.length + " of " + subs.length;
      $("list").innerHTML = rows.length ? rows.map(s => `
        <div class="row">
          <div class="date">${fmt(s.date)}</div>
          ${logo(s.company, s.domain)}
          <div>
            <div class="co">${esc(s.company)}</div>
            <div class="role">${esc(s.role)}</div>
            <div class="meta">${[s.where, s.via].filter(Boolean).map(esc).join(" · ")}</div>
            ${s.note ? `<div class="note">${esc(s.note)}</div>` : ""}
          </div>
          <span class="status s-${esc(s.status)}">${esc(s.status)}</span>
        </div>`).join("") : `<div class="empty">No matches.</div>`;
    }
    draw();

    $("progress").innerHTML = data.inProgress.map(p => `
      <div class="tile">
        <div class="head">${logo(p.company, p.domain)}<div>
        <div class="co">${esc(p.company)}</div>
        <div class="role">${esc(p.role)}</div>
        ${p.where ? `<div class="meta">${esc(p.where)}</div>` : ""}</div></div>
        <dl><div><dt>Where it stands</dt><dd>${esc(p.stands)}</dd></div>
        <div class="next"><dt>Next step</dt><dd>${esc(p.next)}</dd></div></dl>
      </div>`).join("");

    $("recruiters").innerHTML = data.recruiters.map(r => `
      <div class="tile">
        <div class="head">${logo(r.agency, r.domain)}<div>
        <div class="co">${esc(r.agency)}</div>
        <div class="role">${esc(r.client)}</div>
        <div class="meta">${esc(r.type)}</div></div></div>
        <dl><div><dt>Where it stands</dt><dd>${esc(r.stands)}</dd></div></dl>
      </div>`).join("");

    $("targets").innerHTML = data.targets.map(t => `
      <div class="tile">
        <div class="head">${logo(t.company, t.domain)}<div>
        <div class="co">${esc(t.company)}</div>
        <div class="role">${esc(t.role)}</div></div></div>
        <dl><div><dt>Note</dt><dd>${esc(t.note)}</dd></div></dl>
      </div>`).join("");
  }
})();
</script>
</body>
</html>
