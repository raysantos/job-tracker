<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Job Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23ffecce'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='700' font-size='34' text-anchor='middle' fill='%23111'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f3f1; --surface:#ffffff; --surface-2:#f8f7f5; --text:#16181d; --muted:#5d6370; --line:#e3e1dc;
  --navy:#1d2340; --accent:#ff6a3d; --teal:#2bb3a3; --cream:#ffecce;
  --applied:#3d63dd; --screen:#b7791f; --interview:#2b8a3e; --offer:#0e8a7a; --rejected:#9aa0a6;
  --radius:30px; --shadow:0 1px 2px rgba(20,22,30,.06),0 8px 24px rgba(20,22,30,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101217; --surface:#191c23; --surface-2:#20242c; --text:#eceef2; --muted:#9aa1ad; --line:#2a2f39;
    --navy:#e8ebf5; --accent:#ff7a4d; --applied:#7d9bff; --screen:#e6b25a; --interview:#5fcf7a; --offer:#4fd1c0; --rejected:#7d838c;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#101217; --surface:#191c23; --surface-2:#20242c; --text:#eceef2; --muted:#9aa1ad; --line:#2a2f39;
  --navy:#e8ebf5; --accent:#ff7a4d; --applied:#7d9bff; --screen:#e6b25a; --interview:#5fcf7a; --offer:#4fd1c0; --rejected:#7d838c;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 "Sofia Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}

/* hero */
.hero{position:relative;overflow:hidden;color:#fff;padding:28px 0 76px;
  background:linear-gradient(120deg,#ff7a59,#ff9f6b 30%,#5cc8b8 70%,#2b8fb3);background-size:200% 200%;animation:drift 18s ease-in-out infinite}
@keyframes drift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@media (prefers-reduced-motion:reduce){.hero{animation:none}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px}
.mark i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--cream);color:#111;font-style:normal;font-weight:700}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:rgba(255,255,255,.22);color:#fff;transition:background .2s}
.iconbtn:hover{background:rgba(255,255,255,.34)}
.iconbtn svg{width:20px;height:20px}
h1{font-weight:300;font-size:clamp(34px,6vw,56px);line-height:1.05;margin:36px 0 6px;letter-spacing:-.5px}
h1 b{font-weight:700}
.sub{opacity:.92;margin:0}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:-52px;position:relative}
.stat{background:var(--surface);border-radius:24px;padding:18px 20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.stat .n{font-size:36px;font-weight:700;line-height:1;color:var(--navy)}
.stat .l{color:var(--muted);font-size:14px;margin-top:6px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}

/* sections */
section{margin:40px 0}
h2{font-size:24px;font-weight:600;margin:0 0 14px;display:flex;align-items:baseline;gap:10px}
h2 small{color:var(--muted);font-size:15px;font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;outline:none}
.search:focus{border-color:var(--accent)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--bg);border-color:var(--navy)}

/* list rows */
.row{display:grid;grid-template-columns:76px 40px 1fr auto;gap:14px;align-items:center;padding:16px 22px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.date{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.co{font-weight:700;font-size:17px}
.role{color:var(--text)}
.meta{color:var(--muted);font-size:14px}
.note{color:var(--accent);font-size:14px;margin-top:2px}
.status{font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.s-Applied{color:var(--applied)} .s-Screening{color:var(--screen)} .s-Interviewing{color:var(--interview)} .s-Offer{color:var(--offer)} .s-Rejected{color:var(--rejected)}
.empty{padding:28px 22px;color:var(--muted)}
@media (max-width:640px){
  .row{grid-template-columns:40px 1fr auto;padding:14px 18px}
  .row .date{grid-column:1/-1;order:-1}
}

/* logos */
.logo{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;
  background:#fff;border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--navy)}
.logo img{width:24px;height:24px;object-fit:contain;display:block}
.logo.ini{background:var(--surface-2)}
.tile .head{display:flex;gap:12px;align-items:flex-start}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.tile .co{margin-bottom:2px}
.tile dl{margin:14px 0 0;display:grid;gap:8px}
.tile dt{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.tile dd{margin:0}
.tile .next{background:var(--surface-2);border-radius:14px;padding:10px 12px}

/* lock */
.lock{min-height:100vh;display:grid;place-items:center;padding:16px;
  background:linear-gradient(120deg,#ff7a59,#ff9f6b 30%,#5cc8b8 70%,#2b8fb3)}
.lockcard{width:100%;max-width:380px;background:var(--surface);border-radius:var(--radius);padding:32px 28px;box-shadow:0 20px 60px rgba(0,0,0,.18);text-align:center}
.lockcard .mark{justify-content:center;margin-bottom:18px}
.lockcard h2{justify-content:center;font-weight:300;font-size:30px;margin-bottom:6px}
.lockcard p{color:var(--muted);margin:0 0 20px}
.lockcard input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:13px 18px;text-align:center;outline:none;letter-spacing:1px}
.lockcard input:focus{border-color:var(--accent)}
.lockcard button{margin-top:12px;width:100%;border:0;border-radius:999px;padding:13px;background:var(--navy);color:var(--bg);font-weight:600;cursor:pointer}
.err{color:#d93025;font-size:14px;min-height:20px;margin-top:10px}
footer{color:var(--muted);font-size:14px;padding:24px 0 48px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="lock" id="lock">
  <form class="lockcard" id="lockform" autocomplete="off">
    <div class="mark"><i>R</i></div>
    <h2>Job Tracker</h2>
    <p>Enter your passcode to view.</p>
    <input id="pass" type="password" placeholder="Passcode" aria-label="Passcode" autofocus>
    <button type="submit">Unlock</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
  <header class="hero">
    <div class="wrap">
      <div class="top">
        <div class="mark"><i>R</i> Raysan Designs</div>
        <div style="display:flex;gap:8px">
          <button class="iconbtn" id="theme" aria-label="Switch to dark mode"></button>
          <button class="iconbtn" id="lockbtn" aria-label="Lock">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          </button>
        </div>
      </div>
      <h1>Job <b>Tracker</b></h1>
      <p class="sub" id="updated"></p>
    </div>
  </header>

  <main class="wrap">
    <div class="stats" id="stats"></div>

    <section>
      <h2>Submitted <small id="subcount"></small></h2>
      <div class="bar">
        <input class="search" id="q" type="search" placeholder="Search company or role" aria-label="Search">
        <div id="filters" style="display:flex;gap:8px;flex-wrap:wrap"></div>
      </div>
      <div class="card" id="list"></div>
    </section>

    <section>
      <h2>In progress <small>needs one action from you</small></h2>
      <div class="tiles" id="progress"></div>
    </section>

    <section>
      <h2>Recruiters &amp; contracts</h2>
      <div class="tiles" id="recruiters"></div>
    </section>

    <section>
      <h2>Not yet applied</h2>
      <div class="tiles" id="targets"></div>
    </section>

    <footer><span>Private · encrypted on this page</span><span id="foot"></span></footer>
  </main>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const STATUSES = ["Applied","Screening","Interviewing","Offer","Rejected"];

  /* theme: icon-only sun/moon */
  const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  const store = { get(k){ try { return localStorage.getItem(k) } catch { return null } }, set(k,v){ try { localStorage.setItem(k,v) } catch {} } };
  const isDark = () => (document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
  const paintTheme = () => { const d = isDark(); $("theme").innerHTML = d ? SUN : MOON; $("theme").setAttribute("aria-label", d ? "Switch to light mode" : "Switch to dark mode"); };
  const saved = store.get("jt-theme"); if (saved) document.documentElement.dataset.theme = saved;
  $("theme").onclick = () => { const t = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = t; store.set("jt-theme", t); paintTheme(); };
  paintTheme();

  /* decrypt: PBKDF2-SHA256 -> AES-GCM-256 */
  async function decrypt(pass) {
    const env = await fetch("data.enc.json", { cache: "no-store" }).then(r => r.json());
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(env.salt), iterations: env.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(env.iv) }, key, b64(env.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  $("lockform").onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector("button");
    $("err").textContent = ""; btn.textContent = "Unlocking…"; btn.disabled = true;
    try { render(await decrypt($("pass").value)); $("pass").value = ""; $("lock").hidden = true; $("app").hidden = false; }
    catch { $("err").textContent = "That passcode didn't work."; }
    finally { btn.textContent = "Unlock"; btn.disabled = false; }
  };
  $("lockbtn").onclick = () => { $("app").hidden = true; $("lock").hidden = false; ["stats","list","progress","recruiters","targets"].forEach(id => $(id).innerHTML = ""); $("pass").focus(); };

  const initials = n => String(n || "?").replace(/\(.*?\)/g, "").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
  const logo = (name, domain) => domain
    ? `<span class="logo"><img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('ini');this.parentNode.textContent='${esc(initials(name))}'"></span>`
    : `<span class="logo ini" aria-hidden="true">${esc(initials(name))}</span>`;

  const fmt = d => new Date(d + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });

  function render(data) {
    const subs = data.submitted.slice().sort((a,b) => b.date.localeCompare(a.date));
    $("updated").textContent = "Updated " + new Date(data.updated + "T12:00:00").toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
    $("foot").textContent = subs.length + " applications since " + fmt(subs[subs.length-1].date);
    const active = subs.filter(s => ["Screening","Interviewing","Offer"].includes(s.status)).length;
    $("stats").innerHTML = [
      [subs.length, "Submitted"], [data.inProgress.length, "In progress"],
      [data.recruiters.length, "Recruiters"], [active, "Interviews & screens"]
    ].map(([n,l]) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");

    let filter = "All", q = "";
    const counts = Object.fromEntries(STATUSES.map(s => [s, subs.filter(x => x.status === s).length]));
    const opts = ["All", ...STATUSES.filter(s => counts[s])];
    $("filters").innerHTML = opts.map(o => `<button class="chip" data-f="${o}" aria-pressed="${o==="All"}">${o}${o==="All" ? "" : " · " + counts[o]}</button>`).join("");
    $("filters").onclick = e => { const b = e.target.closest(".chip"); if (!b) return; filter = b.dataset.f; $("filters").querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b)); draw(); };
    $("q").oninput = e => { q = e.target.value.toLowerCase(); draw(); };

    function draw() {
      const rows = subs.filter(s => (filter === "All" || s.status === filter) && (!q || (s.company + " " + s.role).toLowerCase().includes(q)));
      $("subcount").textContent = rows.length === subs.length ? subs.length + " total" : rows.length + " of " + subs.length;
      $("list").innerHTML = rows.length ? rows.map(s => `
        <div class="row">
          <div class="date">${fmt(s.date)}</div>
          ${logo(s.company, s.domain)}
          <div>
            <div class="co">${esc(s.company)}</div>
            <div class="role">${esc(s.role)}</div>
            <div class="meta">${[s.where, s.via].filter(Boolean).map(esc).join(" · ")}</div>
            ${s.note ? `<div class="note">${esc(s.note)}</div>` : ""}
          </div>
          <span class="status s-${esc(s.status)}">${esc(s.status)}</span>
        </div>`).join("") : `<div class="empty">No matches.</div>`;
    }
    draw();

    $("progress").innerHTML = data.inProgress.map(p => `
      <div class="tile">
        <div class="head">${logo(p.company, p.domain)}<div>
        <div class="co">${esc(p.company)}</div>
        <div class="role">${esc(p.role)}</div>
        ${p.where ? `<div class="meta">${esc(p.where)}</div>` : ""}</div></div>
        <dl><div><dt>Where it stands</dt><dd>${esc(p.stands)}</dd></div>
        <div class="next"><dt>Next step</dt><dd>${esc(p.next)}</dd></div></dl>
      </div>`).join("");

    $("recruiters").innerHTML = data.recruiters.map(r => `
      <div class="tile">
        <div class="head">${logo(r.agency, r.domain)}<div>
        <div class="co">${esc(r.agency)}</div>
        <div class="role">${esc(r.client)}</div>
        <div class="meta">${esc(r.type)}</div></div></div>
        <dl><div><dt>Where it stands</dt><dd>${esc(r.stands)}</dd></div></dl>
      </div>`).join("");

    $("targets").innerHTML = data.targets.map(t => `
      <div class="tile">
        <div class="head">${logo(t.company, t.domain)}<div>
        <div class="co">${esc(t.company)}</div>
        <div class="role">${esc(t.role)}</div></div></div>
        <dl><div><dt>Note</dt><dd>${esc(t.note)}</dd></div></dl>
      </div>`).join("");
  }
})();
</script>
</body>
</html>
